<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex,follow">
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#101214; color:#EDEEF0;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:34rem; padding:2rem 1.25rem; text-align:center; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; font-weight:700; }
  p { color:#98A0AA; margin:.5rem 0 1.25rem; }
  a { color:#C9A227; }
</style>
</head>
<body><main>
<h1>Page not found</h1>
<p>There is no page at this address.</p>
<p><a href="/apps/">The apps, with status</a> &middot; <a href="/">Home</a></p>
</main></body>
</html>
<!--
Deliberately plain. This page must not carry the homepage's <title> or any
marketing copy: a content check that compares a URL's body against the
homepage has to be able to tell a catch-all from a real page, and a branded
404 that reads like the homepage defeats exactly the check it should pass.

GitHub Pages serves this for unmatched paths on the apex and returns a real
404 status with it. Verified 2026-10-13 that the apex already returned 404
(not a 200 with the homepage) before this file existed; this replaces
GitHub's default page, it does not fix a fallback bug. The hosts that DO have
that bug are Cloudflare Pages projects and are fixed in baker-ventures-geo.
-->
