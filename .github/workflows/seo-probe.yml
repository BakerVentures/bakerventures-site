name: seo-probe

on:
  push:
    branches: [claude/debugging-session-g0l64p]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe URL variants for redirects
        run: |
          probe () {
            echo "----------------------------------------"
            echo "URL: $1"
            curl -sS -o /dev/null -A "Mozilla/5.0 (compatible; Googlebot/2.1)" \
              --max-time 25 -w \
              'final=%{url_effective}\ncode=%{http_code}\nredirects=%{num_redirects}\n' \
              -L "$1" 2>&1 || echo "FAILED"
            echo "-- first hop headers --"
            curl -sSI -A "Mozilla/5.0 (compatible; Googlebot/2.1)" --max-time 25 "$1" 2>&1 \
              | grep -iE '^(HTTP/|location:|content-type:)' || true
          }

          for u in \
            "http://bakerventuresstudio.com/" \
            "https://bakerventuresstudio.com/" \
            "http://www.bakerventuresstudio.com/" \
            "https://www.bakerventuresstudio.com/" \
            "https://bakerventuresstudio.com/rizzmaxx/privacy" \
            "https://bakerventuresstudio.com/rizzmaxx/privacy/" \
            "https://bakerventuresstudio.com/rizzmaxx/privacy/index.html" \
            "https://bakerventuresstudio.com/rizzmaxx/terms" \
            "https://bakerventuresstudio.com/flirtgym" \
            "https://bakerventuresstudio.com/flirtgym/research/" \
            "https://bakerventuresstudio.com/index.html" \
            "https://bakerventures.github.io/bakerventures-site/" \
            "https://flirtgym.app/" \
            "https://bakerventuresstudio.com/sitemap.xml" \
            "https://bakerventuresstudio.com/robots.txt" ; do
            probe "$u"
          done

      - name: Show canonical tags as served live
        run: |
          for p in "" "flirtgym/" "rizzmaxx/" "rizzmaxx/privacy/" "rizzmaxx/terms/"; do
            echo "--- /$p"
            curl -sS --max-time 25 "https://bakerventuresstudio.com/$p" \
              | grep -iE 'rel="canonical"|name="robots"' || echo "  (none served)"
          done
